<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4efe7">
    <title>Pocket Training · Climbing performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-page="dashboard" aria-label="Pocket Training home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Pocket<span class="brand-light">Training</span></span>
        </a>
        <div class="nav-label">Training</div>
        <nav class="nav-group">
          <button class="nav-item" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
          <button class="nav-item" data-page="planner"><span class="nav-icon">▦</span>Planner</button>
          <button class="nav-item" data-page="workouts"><span class="nav-icon">◈</span>Workouts</button>
        </nav>
        <div class="nav-label">Performance</div>
        <nav class="nav-group">
          <button class="nav-item" data-page="metrics"><span class="nav-icon">⌁</span>Metrics</button>
          <button class="nav-item" data-page="goals"><span class="nav-icon">◎</span>Goals</button>
          <button class="nav-item" data-page="tests"><span class="nav-icon">↗</span>Tests</button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="cycle-side-card">
          <div class="eyebrow">Fall send cycle</div>
          <div class="cycle-side-title">Week 7 of 12</div>
          <div class="cycle-track"><span></span></div>
          <div class="cycle-side-foot"><span>Power phase</span><span>58%</span></div>
        </div>
        <button class="profile-button" data-action="profile">
          <span class="avatar">AL</span><span class="profile-copy"><strong>Avery Lane</strong><small>Self-coached · 70.1 kg</small></span><span class="more-dots">···</span>
        </button>
      </aside>
      <main class="main-area">
        <header class="mobile-header">
          <a class="brand" href="#" data-page="dashboard"><span class="brand-mark"><i></i><i></i><i></i></span><span>Pocket<span class="brand-light">Training</span></span></a>
          <span class="avatar">AL</span>
        </header>
        <div id="app" class="page-wrap"></div>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-page="dashboard"><span>⌂</span>Today</button>
      <button data-page="planner"><span>▦</span>Plan</button>
      <button data-page="workouts"><span>◈</span>Train</button>
      <button data-page="metrics"><span>⌁</span>Metrics</button>
      <button data-page="goals"><span>◎</span>Goals</button>
      <button data-page="tests"><span>↗</span>Tests</button>
    </nav>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
